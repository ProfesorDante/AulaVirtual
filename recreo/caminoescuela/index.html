<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Camino a la Escuela - Nivel 1 Polish 0.3</title>
<link rel="stylesheet" href="style.css?v=POLISH062">

<style id="coverStyles">
.game-cover{
  position:fixed; inset:0; z-index:99999;
  display:flex; align-items:center; justify-content:center;
  background:#000;
}
.game-cover img{
  width:100%; height:100%;
  object-fit:contain;
  user-select:none; -webkit-user-drag:none;
}
.cover-start{
  position:absolute;
  /* Zona transparente exactamente sobre "EMPEZAR A JUGAR" de la portada */
  left:30.1%; top:88.2%; width:40.8%; height:8.6%;
  border:0; background:transparent; cursor:pointer;
  border-radius:10px;
}
.cover-start:focus-visible{
  outline:4px solid #fff;
  outline-offset:3px;
}
.game-cover.hidden{display:none}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">🦍 CAMINO A LA ESCUELA</div>
    <div class="hud">
      <div class="pill">Mundo: <span id="worldName">Sendero</span></div>
      <div class="pill">❤️ <span class="bar"><span id="heartFill" class="fill"></span></span></div>
      <div class="pill">🍌 <span id="bananas">0</span></div>
      <div class="pill">🍎🍊 <span id="fruits">0</span></div>
      <div class="pill">👦 <span id="students">0</span></div>
      <div class="pill">⏱ <span id="time">10:00</span></div>
    </div>
  </div>

  <div class="gameArea">
    
<div id="gameCover" class="game-cover" aria-label="Portada de Camino a la Escuela">
  <img src="img/portadacaminoescuela.png" alt="Camino a la Escuela - Nivel 1">
  <button id="coverStartButton" class="cover-start" type="button" aria-label="Empezar a jugar"></button>
</div>

<canvas id="game" width="960" height="540"></canvas>
    <div class="miniHud" id="miniHud">
      <div class="hudCircle bananaCircle" title="Bananas">
        <span class="hudBanana">🍌</span><strong id="miniBananas">0</strong>
      </div>
      <div class="hudCircle instrumentCircle" title="Instrumento · A">
        <span class="hudGhost">♪</span><span id="instrumentIcon" class="hudOwned"></span>
        <span class="hudKey pcOnly">A</span>
      </div>
      <div class="hudCircle useCircle" id="useCircle" title="Objeto · D · cambiar con F">
        <span class="hudGhost">✋</span><span id="itemIcon" class="hudOwned"></span>
        <span class="hudKey pcOnly">D</span>
      </div>
      <div class="hudCircle equipmentCircle" title="Equipamiento"><span class="hudGhost">◇</span><span id="equipmentIcon" class="hudOwned"></span></div>
    </div>

    <div id="teleportPanel" class="teleportPanel" style="display:none">
      <div class="teleportCard">
        <strong>F2 · Teletransporte de prueba</strong>
        <input id="teleportInput" autocomplete="off" placeholder="X,Y">
        <div class="teleportHelp">↓ posición actual · ↑ última posición · Enter viajar · Esc cerrar</div>
      </div>
    </div>

    <div id="startOverlay" class="overlay" style="display:none"></div>

    <div id="storyCurtain" class="storyCurtain" style="display:none">
      <div class="storyPanel">
        <div id="storyText" class="storyText"></div>
      </div>
    </div>

    <div id="endOverlay" class="overlay" style="display:none">
      <div class="card">
        <h1 id="endTitle">🏫 ¡Comienza un nuevo día!</h1>
        <p id="endText"></p>
        <div class="buttons">
          <button onclick="startGame()">🔄 Jugar otra vez</button>
          <button class="soft" onclick="showStart()">🏠 Volver</button>
        </div>
      </div>
    </div>
  </div>
    <div class="mobileControls" aria-hidden="true">
      <div class="virtualStick" id="virtualStick">
        <div class="stickKnob" id="stickKnob"></div>
      </div>
      <div class="mobileActions">
        <button type="button" class="mobileAction musicBtn" id="mobileMusic" aria-label="Tocar instrumento">♪</button>
        <button type="button" class="mobileAction useBtn" id="mobileUse" aria-label="Usar objeto">✋</button>
      </div>
    </div>
  <div class="credit">© 2026 Dante Martín · Aula Virtual – El Gran Árbol</div>
</div>

<script src="game.js?v=POLISH062"></script>

<script id="coverLogic">
(function(){
  const cover=document.getElementById("gameCover");
  const start=document.getElementById("coverStartButton");
  if(!cover || !start) return;

  // Mientras está la portada, bloqueamos teclas del juego.
  window.__caminoCoverOpen=true;

  function beginGame(){
    cover.classList.add("hidden");
    window.__caminoCoverOpen=false;
    if(typeof window.playStoryIntro==="function"){
      window.playStoryIntro();
      return;
    }

    // El click del usuario permite iniciar/reanudar AudioContext en navegadores.
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(window.audioCtx && window.audioCtx.state==="suspended") window.audioCtx.resume();
    }catch(e){}

    // Aviso opcional para cualquier lógica de música existente.
    window.dispatchEvent(new CustomEvent("camino-game-start"));
  }

  start.addEventListener("click", beginGame);
  start.addEventListener("touchend", function(e){
    e.preventDefault();
    beginGame();
  }, {passive:false});

  // Enter también sirve cuando el botón tiene foco.
  start.addEventListener("keydown", function(e){
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      beginGame();
    }
  });
})();
</script>

</body>
</html>
