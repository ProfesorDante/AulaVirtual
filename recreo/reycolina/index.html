<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173e20">
  <title>Rey de la Colina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app">
    <section id="coverScreen" class="screen cover-screen is-active" aria-label="Portada de Rey de la Colina">
      <div id="coverFrame" class="cover-frame">
        <img class="cover-image" src="../../img/portadacolina.png" alt="Rey de la Colina">
        <button id="coverStart" class="cover-hotspot" type="button" aria-label="Jugar ahora"></button>
      </div>
    </section>

    <section id="modeScreen" class="screen menu-screen">
      <div class="forest-card">
        <p class="eyebrow">REY DE LA COLINA</p>
        <h1>¿Cómo van a jugar?</h1>
        <div class="choice-grid choice-grid--two">
          <button class="choice-card" type="button" data-mode="solo"><span>🙋</span><strong>UN JUGADOR</strong></button>
          <button class="choice-card" type="button" data-mode="coop"><span>🙌</span><strong>COOPERATIVO</strong></button>
        </div>
      </div>
    </section>

    <section id="characterScreen" class="screen menu-screen">
      <div class="forest-card">
        <p class="eyebrow">JUGADOR 1</p>
        <h1>Elegí tu personaje</h1>
        <div class="choice-grid choice-grid--two">
          <button class="choice-card" type="button" data-character="tina"><span>🐒</span><strong>TINA</strong></button>
          <button class="choice-card" type="button" data-character="nito"><span>🐵</span><strong>NITO</strong></button>
        </div>
        <button class="back-button" type="button" data-back="mode">← Volver</button>
      </div>
    </section>

    <section id="allyScreen" class="screen menu-screen">
      <div class="forest-card forest-card--wide">
        <p class="eyebrow">ANTES DE LA RONDA</p>
        <h1>Elegí un compañero</h1>
        <div class="choice-grid choice-grid--three">
          <button class="choice-card" type="button" data-ally="loro"><span>🦜</span><strong>LORO</strong></button>
          <button class="choice-card" type="button" data-ally="perezoso"><span>🦥</span><strong>PEREZOSO</strong></button>
          <button class="choice-card" type="button" data-ally="cocodrilo"><span>🐊</span><strong>COCODRILO</strong></button>
        </div>
        <button class="back-button" type="button" data-back="character">← Volver</button>
      </div>
    </section>


    <section id="rivalScreen" class="screen menu-screen">
      <div class="forest-card forest-card--wide">
        <p class="eyebrow">EQUIPO RIVAL</p>
        <h1>¿Cómo jugarán los bots?</h1>
        <div class="choice-grid choice-grid--four">
          <button class="choice-card" type="button" data-rival-style="ofensivo"><span>🔥</span><strong>OFENSIVO</strong></button>
          <button class="choice-card" type="button" data-rival-style="defensivo"><span>🛡️</span><strong>DEFENSIVO</strong></button>
          <button class="choice-card" type="button" data-rival-style="todoterreno"><span>🌿</span><strong>TODOTERRENO</strong></button>
          <button class="choice-card" type="button" data-rival-style="tactico"><span>🧠</span><strong>TÁCTICO</strong></button>
        </div>
        <button class="back-button" type="button" data-back="ally">← Volver</button>
      </div>
    </section>

    <section id="readyScreen" class="screen ready-screen">
      <div class="ready-panel">
        <p class="eyebrow">NIVEL 1</p>
        <h1>CAOS EN LA COLINA</h1>
        <div id="teamSummary" class="team-summary"></div>
        <button id="startLevel" class="main-button" type="button">ENTRAR</button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen" aria-label="El corazón del árbol">
      <div id="gameShell" class="game-shell">
        <canvas id="gameCanvas" width="2000" height="1125"></canvas>
        <div class="hud">
          <div class="hud-card hud-score"><span>🔴</span><strong id="scoreLabel">0</strong><small>/ 20</small></div><div class="hud-card hud-score"><span>🔵</span><strong id="rivalScoreLabel">0</strong><small>/ 20</small></div>
          <span id="flagStateIcon" hidden>🚩</span><strong id="flagStateLabel" hidden>LIBRE</strong>
          <strong id="heartsLabel" hidden>3 · 3</strong>
          <button id="pauseButton" class="icon-button" type="button" aria-label="Pausa">Ⅱ</button>
        </div>
        <div id="controlHint" class="control-hint"></div>
        <div class="touch-pad touch-pad--p1">
          <button data-touch="p1-up">▲</button>
          <button data-touch="p1-left">◀</button>
          <button data-touch="p1-action">●</button>
          <button data-touch="p1-right">▶</button>
          <button data-touch="p1-down">▼</button>
        </div>
        <div class="touch-pad touch-pad--p2">
          <button data-touch="p2-up">▲</button>
          <button data-touch="p2-left">◀</button>
          <button data-touch="p2-action">●</button>
          <button data-touch="p2-right">▶</button>
          <button data-touch="p2-down">▼</button>
        </div>
      </div>
    </section>

    <section id="victoryScreen" class="screen victory-screen">
      <div class="victory-card">
        <div class="victory-crown">👑</div>
        <p class="eyebrow">NIVEL 1</p>
        <h1>¡EL CORAZÓN ES SUYO!</h1>
        <div id="victoryTeam" class="team-summary"></div>
        <div class="victory-actions">
          <button id="playAgain" class="main-button" type="button">OTRA VEZ</button>
          <button id="changeChoices" class="secondary-button" type="button">CAMBIAR EQUIPO</button>
        </div>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
